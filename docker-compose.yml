# CFS Fundraiser: the app in one container and PostgreSQL in another. The same file runs on an
# x86 PC or server, on a Raspberry Pi, and - with docker-compose.cloud.yml adding HTTPS in front -
# on the cloud droplet (Documents/Cloud Deployment.md).
#
#   docker compose up -d --build        # build the app image here from source, then start
#   docker compose pull && docker compose up -d     # or use the published image
#
# Put the secrets in a .env file next to this one:
#
#   POSTGRES_PASSWORD=<a long random password>
#   JWT_KEY=<a long random secret, 32+ characters>      (required: the app won't start without it)
#   SEED_ADMIN_PASSWORD=<the first account's password>  (optional: otherwise one is written to the log)
#   CFS_IMAGE=ghcr.io/<owner>/cfs-fundraiser:cloud     (optional: which published image to pull)
#
# To email receipts and reports, also add the EMAIL_* settings (see README.md).
# SKIP_SEED_DATA=true starts with an empty catalog instead of the sample one.
#
# Then browse to http://<this machine's IP>:8080 from any device on the network.
services:
  db:
    image: postgres:16-alpine
    container_name: cfs-db
    environment:
      POSTGRES_DB: CfsFundraiser
      POSTGRES_USER: cfs
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-Change_Me_2026}"
    volumes:
      - cfs-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfs -d CfsFundraiser"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  app:
    # The published image by default - :cloud is this branch's, built by cloud-deploy.yml on every
    # push to Cloud-Support; `docker compose up -d --build` builds it here from source instead (and
    # tags the result with this same name).
    image: "${CFS_IMAGE:-ghcr.io/llkirkwood9/cfs-fundraiser:cloud}"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cfs-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=CfsFundraiser;Username=cfs;Password=${POSTGRES_PASSWORD:-Change_Me_2026}"
      # Required: the app refuses to start without a real secret of 32+ characters.
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in the .env file to a random secret of 32+ characters}"
      # Set SKIP_SEED_DATA=true to leave out the sample catalog, delivery options and event.
      # The first sign-in account (admin) is still created on an empty database, with the password
      # in SEED_ADMIN_PASSWORD - or, when that is blank, a random one written once to the log
      # (docker logs). It has to be changed at first sign-in either way.
      Seed__Skip: "${SKIP_SEED_DATA:-false}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:-}"
      # Browsers reach this box directly, so headers claiming another address or HTTPS are not
      # believed. docker-compose.cloud.yml turns this on for the droplet, where Caddy sits in front.
      ForwardedHeaders__Enabled: "false"
      # Optional: email receipts and event reports. Leave EMAIL_HOST empty to keep email off.
      Email__Host: "${EMAIL_HOST:-}"
      Email__Port: "${EMAIL_PORT:-587}"
      Email__Security: "${EMAIL_SECURITY:-StartTls}"
      Email__Username: "${EMAIL_USERNAME:-}"
      Email__Password: "${EMAIL_PASSWORD:-}"
      Email__From: "${EMAIL_FROM:-}"
      Email__FromName: "${EMAIL_FROM_NAME:-}"
      Email__ReplyTo: "${EMAIL_REPLY_TO:-}"
    restart: unless-stopped

volumes:
  cfs-pgdata:
