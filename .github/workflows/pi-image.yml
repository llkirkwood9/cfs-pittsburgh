# Builds the Raspberry Pi image (ARM64) and publishes it to this repository's container registry,
# so the Pi only ever has to pull. Runs on every push to main that touches the app, and can be
# started by hand from the Actions tab.
name: Pi image

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "dashboard/**"
      - "Dockerfile.app"
      - ".github/workflows/pi-image.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The final stage installs a package as ARM64, which needs emulation on an x86 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cfs-fundraiser:latest
            ghcr.io/${{ github.repository_owner }}/cfs-fundraiser:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
