# Builds the app image for x86 (amd64) and ARM (arm64, the Raspberry Pi) and publishes it to this
# repository's container registry, so a venue box or a Pi only ever has to pull. Runs on every push
# to main that touches the app, and can be started by hand from the Actions tab.
name: App image

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "dashboard/**"
      - "Dockerfile"
      - ".github/workflows/app-image.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The ARM64 final stage installs a package, which needs emulation on an x86 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cfs-fundraiser:latest
            ghcr.io/${{ github.repository_owner }}/cfs-fundraiser:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
