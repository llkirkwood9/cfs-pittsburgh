# Builds the app image for x86 (amd64) and ARM (arm64, the Raspberry Pi) and publishes it to this
# repository's container registry, so a venue box or a Pi only ever has to pull. Runs on every push
# to main that touches the app, and can be started by hand from the Actions tab. Each build is
# versioned YYYY.MM.<build>, numbered from 1 each month, and tagged dashboard-v<version>.
name: App image

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "dashboard/**"
      - "Dockerfile"
      - ".github/workflows/app-image.yml"
  workflow_dispatch:

# One build at a time, so two never take the same build number.
concurrency:
  group: app-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to tag the build with its version
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to number this build

      # The month's builds so far are its dashboard-v<YYYY.MM>.* tags; this one is the next, and
      # its tag is pushed before building so the number can't be used twice.
      - name: Number this build
        id: version
        run: |
          month=$(date -u +%Y.%m)
          last=$(git tag --list "dashboard-v${month}.*" | sed "s/^dashboard-v${month}\.//" | sort -n | tail -1)
          version="${month}.$(( ${last:-0} + 1 ))"
          git tag "dashboard-v${version}"
          git push origin "dashboard-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The ARM64 final stage installs a package, which needs emulation on an x86 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DASHBOARD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cfs-fundraiser:latest
            ghcr.io/${{ github.repository_owner }}/cfs-fundraiser:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/cfs-fundraiser:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
