# Builds main's app image and has Coolify deploy it to the cloud server.
#
# 1. build: the image for x86 (the cloud server) and ARM (a Raspberry Pi), published
#    to this repository's container registry as :cloud, :cloud-<version> and :<commit>. Each build
#    is versioned YYYY.MM.<build>, numbered from 1 each month, and tagged cloud-v<version>.
# 2. deploy: calls the Coolify resource's deploy webhook. Coolify reads docker-compose.coolify.yml,
#    backs up the database, pulls the new :cloud image and restarts the app; this job then follows
#    the deployment until it finishes. Skipped (with a note) until the Coolify secrets are set.
#
# Runs on every push to main that touches the app or its compose file, and by hand from the
# Actions tab - where "Build a new image" can be unticked to redeploy the current one.
#
# Repository settings (Settings -> Secrets and variables -> Actions), described in
# Documents/Cloud Deployment.md, Step 6:
#   secrets:  COOLIFY_WEBHOOK (the resource's Deploy webhook URL),
#             COOLIFY_TOKEN (a Coolify API token with the Deploy and Read permissions)
#   variable: CFS_URL (optional, e.g. https://sales.example.com: checked for Healthy afterwards)
name: Cloud deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "dashboard/**"
      - "Dockerfile"
      - "docker-compose.coolify.yml"
      - ".github/workflows/cloud-deploy.yml"
  workflow_dispatch:
    inputs:
      build:
        description: Build a new image (untick to redeploy the current one)
        type: boolean
        default: true

# One run at a time, so two builds never take the same number and two deploys never overlap.
concurrency:
  group: cloud-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.build)
    runs-on: ubuntu-latest
    permissions:
      contents: write # to tag the build with its version
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to number this build

      # The month's builds so far are its cloud-v<YYYY.MM>.* tags; this one is the next, and its
      # tag is pushed before building so the number can't be used twice.
      - name: Number this build
        id: version
        run: |
          month=$(date -u +%Y.%m)
          last=$(git tag --list "cloud-v${month}.*" | sed "s/^cloud-v${month}\.//" | sort -n | tail -1)
          version="${month}.$(( ${last:-0} + 1 ))"
          git tag "cloud-v${version}"
          git push origin "cloud-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The ARM64 final stage installs a package, which needs emulation on an x86 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DASHBOARD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cfs-fundraiser:cloud
            ghcr.io/${{ github.repository_owner }}/cfs-fundraiser:cloud-${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/cfs-fundraiser:${{ github.sha }}
          cache-from: type=gha,scope=cloud
          cache-to: type=gha,mode=max,scope=cloud

  deploy:
    needs: build
    # After a successful build, or straight away when the build was skipped on purpose.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Deploy with Coolify
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then
            echo "::notice::COOLIFY_WEBHOOK and COOLIFY_TOKEN aren't set yet, so nothing was deployed."
            exit 0
          fi

          response=$(curl -sS --fail-with-body --request POST "$WEBHOOK" --header "Authorization: Bearer $TOKEN")
          echo "$response"

          # Follow the deployment Coolify queued, when its reply names it and the token can read it.
          uuid=$(echo "$response" | jq -r '[.. | .deployment_uuid? // empty] | first // empty' 2>/dev/null || true)
          if [ -z "$uuid" ]; then
            echo "::notice::Coolify accepted the deploy. Follow it on the resource's Deployments page."
            exit 0
          fi

          base="${WEBHOOK%%/api/*}"
          for _ in $(seq 1 90); do
            status=$(curl -sS --header "Authorization: Bearer $TOKEN" "$base/api/v1/deployments/$uuid" | jq -r '.status // empty' 2>/dev/null || true)
            case "$status" in
              finished) echo "Coolify finished the deployment."; exit 0 ;;
              failed|cancelled*) echo "::error::Coolify's deployment $status - see its Deployments page for the log."; exit 1 ;;
              "") echo "::notice::Couldn't read the deployment's progress (the token needs the Read permission). Check Coolify."; exit 0 ;;
            esac
            echo "Coolify: $status"
            sleep 10
          done
          echo "::error::The deployment hadn't finished after 15 minutes."
          exit 1

      - name: Check the app answers
        if: vars.CFS_URL != ''
        env:
          URL: ${{ vars.CFS_URL }}
        run: |
          for _ in $(seq 1 30); do
            if [ "$(curl -fsS "$URL/health" 2>/dev/null)" = "Healthy" ]; then
              echo "$URL is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL/health didn't say Healthy within five minutes."
          exit 1
