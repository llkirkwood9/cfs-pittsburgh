# Kept so a Raspberry Pi set up with this file name carries on unchanged: its boot script
# (docker/pi/cfs-update.sh) runs `docker compose -f docker-compose.pi.yml ...`. Everything lives in
# docker-compose.yml, which this simply includes - the containers, the data volume and the project
# name stay exactly as they were. New setups can use docker-compose.yml directly.
include:
  - docker-compose.yml
