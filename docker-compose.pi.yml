# CFS Fundraiser on a small ARM host such as a Raspberry Pi: the app in one container and
# PostgreSQL in another. SQL Server has no ARM build, which is why this file exists alongside
# docker-compose.yml (the all-in-one SQL Server image for x86 machines).
#
#   docker compose -f docker-compose.pi.yml pull        # get the latest published image
#   docker compose -f docker-compose.pi.yml up -d
#
# Put the secrets in a .env file next to this one:
#
#   CFS_IMAGE=ghcr.io/<owner>/cfs-fundraiser:latest
#   POSTGRES_PASSWORD=<a long random password>
#   JWT_KEY=<a long random secret, 32+ characters>
#
# To email receipts and reports, also add the EMAIL_* settings (see Documents/Raspberry Pi Setup.md).
# SKIP_SEED_DATA=true starts with an empty catalog instead of the sample one.
#
# Then browse to http://<the Pi's IP>:8080 from any device on the network.
services:
  db:
    image: postgres:16-alpine
    container_name: cfs-db
    environment:
      POSTGRES_DB: CfsFundraiser
      POSTGRES_USER: cfs
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-Change_Me_2026}"
    volumes:
      - cfs-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfs -d CfsFundraiser"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  app:
    # Built elsewhere and pulled here; `build` is only used by `docker compose ... build`.
    image: "${CFS_IMAGE:-ghcr.io/llkirkwood9/cfs-fundraiser:latest}"
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: cfs-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      Database__Provider: Postgres
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=CfsFundraiser;Username=cfs;Password=${POSTGRES_PASSWORD:-Change_Me_2026}"
      Jwt__Key: "${JWT_KEY:-CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_OF_AT_LEAST_32_CHARACTERS}"
      # Set SKIP_SEED_DATA=true to leave out the sample catalog, delivery options and event.
      # The first sign-in account (admin / 1234) is still created on an empty database.
      Seed__Skip: "${SKIP_SEED_DATA:-false}"
      # Optional: email receipts and event reports. Leave EMAIL_HOST empty to keep email off.
      Email__Host: "${EMAIL_HOST:-}"
      Email__Port: "${EMAIL_PORT:-587}"
      Email__Security: "${EMAIL_SECURITY:-StartTls}"
      Email__Username: "${EMAIL_USERNAME:-}"
      Email__Password: "${EMAIL_PASSWORD:-}"
      Email__From: "${EMAIL_FROM:-}"
      Email__FromName: "${EMAIL_FROM_NAME:-}"
    restart: unless-stopped

volumes:
  cfs-pgdata:
