# PostgreSQL for local development, matching the connection string in appsettings.json:
#
#   docker compose -f api/docker-compose.yml up -d
#
# The data lives in the cfs-dev-pgdata volume, so it survives restarts. To start over with an empty
# database: docker compose -f api/docker-compose.yml down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: cfs-dev-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: CfsFundraiser
      POSTGRES_USER: cfs
      POSTGRES_PASSWORD: cfs-dev
    volumes:
      - cfs-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfs -d CfsFundraiser"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  cfs-dev-pgdata:
